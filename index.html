<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Custom Gen Tool</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 100%;
      padding: 1.5rem 0;
      text-align: center;
      background-color: var(--card-bg);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      color: var(--accent-color);
    }

    main {
      flex: 1;
      width: 90%;
      max-width: 800px;
      margin: 2rem 0;
    }

    .generator-container {
      width: 100%;
      height: 600px;
      border-radius: 12px;
      overflow: hidden;
      background: var(--card-bg);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>Custom Generator Portal</h1>
  </header>

  <main>
    <div class="generator-container">
      <iframe src="https://perchance.org/y06fzf5rev" title="Perchance Generator"></iframe>
    </div>
  </main>

</body>
</html>
